<section id="accueil" class="hero">
  <div class="hero__content">
    <p class="eyebrow">{{ tagline }}</p>
    <h1>{{ heroTitle }}</h1>
    <p class="hero__copy">{{ heroDescription }}</p>
    <div class="hero__actions">
      <a class="btn btn--primary" [href]="ctaPrimaryHref">{{ ctaPrimaryLabel }}</a>
      <a class="btn btn--ghost" [href]="ctaSecondaryHref">{{ ctaSecondaryLabel }}</a>
    </div>
  </div>
  <div class="hero__badge" aria-hidden="true">Fait maison chaque matin</div>
</section>
